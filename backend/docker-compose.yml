services:
  docelar_api:
    build: .
    container_name: docelar_api
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_SECRET_KEY=${NEXT_PUBLIC_SECRET_KEY}
    ports:
      - 7001:7001
    volumes:
      - ./public/uploads:/app/public/uploads 
      - ./src/database/backups:/app/src/database/backups
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - docelar-api-net

networks:
  docelar-api-net:
    external: true